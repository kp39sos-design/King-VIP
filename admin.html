<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أسرع من نتكم | لوحة الإدارة الاحترافية 👑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#080B18;--card:#12182B;--inner:#0C1224;--tx:#F8FAFF;--sub:#A1AEC8;--a:#38BDF8;--b:#A78BFA;--gold:#FFD166;--ok:#34D399;--bd:rgba(56,189,248,.20);--bd2:rgba(167,139,250,.45);--g1:linear-gradient(135deg,#0284C7,#7C3AED);--g2:linear-gradient(135deg,#FFD700,#FF8A00)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,sans-serif;min-height:100vh;padding:16px;display:flex;justify-content:center}
.admin-wrap{width:100%;max-width:680px}
h1{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:14px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd2);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.card h3{font-size:14px;font-weight:900;color:var(--a);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.in{width:100%;background:var(--inner);border:1px solid var(--bd);color:var(--tx);padding:11px;border-radius:12px;margin-bottom:8px;font-size:12px}
textarea.in{min-height:90px;resize:none}
.btn{width:100%;background:var(--g1);color:#fff;padding:11px;border-radius:12px;font-weight:900;font-size:13px;border:0;cursor:pointer}
.sub{font-size:10px;color:var(--sub)}
.order-card{background:var(--inner);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;font-size:11.5px}
.ticket-card{background:var(--inner);border:1px solid var(--bd2);border-radius:12px;padding:12px;margin-bottom:10px}
</style>
</head>
<body>

<div class="admin-wrap">
  <h1>👑 لوحة التحكم وإدارة متجر أسرع من نتكم 🔥</h1>

  <!-- قسم إدارة البنرات -->
  <div class="card">
    <h3><i class="fa-solid fa-images"></i> إدارة بنرات الواجهة المتحركة (Hero Banners)</h3>
    <p class="sub" style="margin-bottom:8px">أدخل رابط كل صورة في سطر منفصل لتحديث البنرات فوراً في المتجر الرئيسي.</p>
    <textarea id="adminBannersInput" class="in" placeholder="https://..."></textarea>
    <button class="btn" id="saveBannersBtn">💾 حفظ وتحديث البنرات فوراً</button>
    <div id="bannersFeedback" style="font-size:11px;font-weight:700;margin-top:6px"></div>
  </div>

  <!-- قسم شحن الرصيد للعميل -->
  <div class="card">
    <h3><i class="fa-solid fa-bolt"></i> شحن رصيد للعميل عبر الـ ID</h3>
    <input id="adminTargetUid" class="in" placeholder="أدخل ID العميل (مثال: REAL-123456)" style="direction:ltr">
    <input id="adminAmount" class="in" type="number" placeholder="المبلغ المراد إضافته (ج.م)">
    <button class="btn" id="adminSendBalanceBtn" style="background:var(--g2);color:#382000">🚀 شحن رصيد العميل فوراً</button>
    <div id="adminFeedback" style="font-size:11px;font-weight:700;margin-top:6px"></div>
  </div>

  <!-- قسم تذاكر الدعم الفني المباشر -->
  <div class="card">
    <h3><i class="fa-solid fa-headset"></i> تذاكر وشكاوي العملاء (الدعم الفني)</h3>
    <div id="adminTicketsList"><p class="sub">جاري تحميل التذاكر...</p></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAMdGfiAhH1xmG0qETz3KU-nxhua1V4baM",
  authDomain: "real-store-c91ec.firebaseapp.com",
  databaseURL: "https://real-store-c91ec-default-rtdb.firebaseio.com",
  projectId: "real-store-c91ec",
  storageBucket: "real-store-c91ec.appspot.com",
  messagingSenderId: "315828860330",
  appId: "1:315828860330:web:3b2fb64a105ebb1ae627d3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// حفظ البنرات
document.getElementById('saveBannersBtn').onclick = () => {
  const rawText = document.getElementById('adminBannersInput').value.trim();
  const fb = document.getElementById('bannersFeedback');
  if(!rawText) { fb.style.color="#EF4444"; fb.textContent="❌ أدخل رابط صورة واحدة على الأقل"; return; }
  
  const links = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const slidesObject = links.map((link, index) => ({
    img: link,
    title: `Banner ${index + 1}`
  }));

  db.ref('settings/heroSlides').set(slidesObject).then(() => {
    fb.style.color = "var(--ok)";
    fb.textContent = "✅ تم تحديث البنرات بنجاح وتطبيقها في المتجر!";
  }).catch(err => {
    fb.style.color = "#EF4444";
    fb.textContent = "❌ خطأ: " + err.message;
  });
};

// جلب البنرات الحالية لعرضها في الـ textarea عند فتح اللوحة
db.ref('settings/heroSlides').once('value', s => {
  const data = s.val();
  if(data && Array.isArray(data)){
    document.getElementById('adminBannersInput').value = data.map(b => b.img).join('\n');
  }
});

// شحن رصيد للعميل
document.getElementById('adminSendBalanceBtn').onclick = () => {
  const targetId = document.getElementById('adminTargetUid').value.trim();
  const amount = parseFloat(document.getElementById('adminAmount').value);
  const fb = document.getElementById('adminFeedback');
  if(!targetId){ fb.style.color="#EF4444"; fb.textContent="❌ أدخل ID العميل"; return; }
  if(!amount || isNaN(amount)){ fb.style.color="#EF4444"; fb.textContent="❌ أدخل مبلغ صحيح"; return; }
  
  const ref = db.ref('users/'+targetId+'/wallet');
  ref.once('value').then(s=>{
    const cur = s.val()||0, nw = cur + amount;
    ref.set(nw).then(()=>{
      fb.style.color = "var(--ok)";
      fb.textContent = `✅ شُحن (${amount} ج.م) للـ ID: (${targetId}) بنجاح! رصيده الحالي: (${nw} ج.م)`;
      document.getElementById('adminTargetUid').value="";
      document.getElementById('adminAmount').value="";
    }).catch(err=>{ fb.style.color="#EF4444"; fb.textContent="❌ " + err.message; });
  });
};

// جلب وعرض تذاكر الدعم الفني للرد عليها
function loadAdminTickets(){
  db.ref('admin_tickets').on('value', s => {
    const data = s.val() || {};
    const arr = Object.entries(data).sort((a,b)=>(b[1].time||0)-(a[1].time||0));
    const box = document.getElementById('adminTicketsList');
    if(!arr.length){ box.innerHTML = '<p class="sub">لا توجد تذاكر دعم فني حالياً</p>'; return; }
    
    box.innerHTML = arr.map(([id, t]) => `
      <div class="ticket-card">
        <div style="display:flex;justify-content:space-between;font-weight:900;margin-bottom:4px">
          <span style="color:var(--a)">${esc(t.name)} (${esc(t.uid)})</span>
          <span style="font-size:10px;color:var(--sub)">${new Date(t.time).toLocaleString('ar-EG')}</span>
        </div>
        <b style="font-size:12.5px;color:var(--gold)">العنوان: ${esc(t.subject)}</b>
        <p style="margin:6px 0;color:var(--tx)">الرسالة: ${esc(t.message)}</p>
        <div style="margin-top:8px">
          <input id="reply_${id}" class="in" placeholder="اكتب رد الإدارة هنا..." value="${esc(t.reply||'')}" style="margin-bottom:4px">
          <button class="btn" style="padding:6px;font-size:11px" onclick="sendAdminReply('${esc(t.uid)}','${esc(id)}')">💬 إرسال الرد للعميل</button>
        </div>
      </div>
    `).join("");
  });
}

window.sendAdminReply = function(uid, ticketId){
  const replyText = document.getElementById('reply_' + ticketId).value.trim();
  if(!replyText) return alert("اكتب الرد أولاً");
  
  // تحديث الرد في تذكرة المستخدم وتذكرة الإدارة
  Promise.all([
    db.ref('support_tickets/'+uid+'/'+ticketId+'/reply').set(replyText),
    db.ref('admin_tickets/'+ticketId+'/reply').set(replyText)
  ]).then(()=>{
    alert("✅ تم إرسال الرد للعميل بنجاح!");
  }).catch(err => alert("❌ خطأ: " + err.message));
};

loadAdminTickets();
</script>
</body>
</html>
