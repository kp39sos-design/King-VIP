<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REAL STORE ADMIN | لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#080B18;--card:#12182B;--inner:#0C1224;--tx:#F8FAFF;--sub:#A1AEC8;--a:#38BDF8;--b:#A78BFA;--gold:#FFD166;--ok:#34D399;--bd:rgba(56,189,248,.20);--bd2:rgba(167,139,250,.45);--modal:#12182B;--sh:0 12px 24px -6px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Cairo,sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:600px;min-height:100vh;background:var(--bg);position:relative;padding:16px 12px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin-bottom:16px;border-radius:18px;background:var(--card);border:1px solid var(--bd2)}
.brand{display:flex;align-items:center;gap:10px}
.brand-t{background:linear-gradient(90deg,#06B6D4,#9333EA,#D99B16);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;font-size:16px}
.sub{font-size:10px;color:var(--sub);font-weight:600}
.ibtn{height:36px;padding:0 12px;border-radius:50px;background:var(--inner);color:var(--a);border:1px solid var(--bd);font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.form{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.ttl{font-size:15px;font-weight:900;margin:12px 0;border-inline-start:4px solid var(--gold);padding-inline-start:8px;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--inner);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.st b{display:block;font-size:20px;color:var(--a);margin-top:2px}.st span{font-size:10.5px;color:var(--sub)}
.in{width:100%;background:var(--inner);border:1px solid var(--bd);color:var(--tx);padding:11px 14px;border-radius:12px;margin-bottom:10px;font-size:12.5px}
.copy{width:100%;background:linear-gradient(135deg,#0284C7,#7C3AED);color:#fff;padding:11px;border-radius:12px;font-weight:900;font-size:12.5px;border:0;cursor:pointer}
.order-card{background:var(--inner);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.oc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.oc-top b{font-size:11.5px;color:var(--a);direction:ltr}
.status-pill{padding:3px 10px;border-radius:20px;font-size:9.5px;font-weight:900}
.st-pending{background:rgba(245,158,11,.15);color:#D97706}
.st-paid{background:rgba(37,99,235,.15);color:#2563EB}
.st-processing{background:rgba(147,51,234,.15);color:#9333EA}
.st-done{background:rgba(22,163,74,.15);color:#16A34A}
.st-rejected,.st-cancelled{background:rgba(239,68,68,.15);color:#EF4444}
#gate{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:#030712}
.g-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd2);border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.8)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:14px;background:linear-gradient(135deg,#FFD700,#FF8A00);color:#382000;font-weight:900;font-size:13.5px;border:0;cursor:pointer;margin-top:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99998;background:var(--card);border:1px solid var(--a);color:var(--tx);padding:8px 18px;border-radius:20px;font-weight:800;font-size:11px;display:none}
</style>
</head>
<body>

<div id="gate">
  <div class="g-card">
    <h2 style="font-size:18px;margin-bottom:8px">👑 لوحة إدارة REAL STORE</h2>
    <p class="sub" style="margin-bottom:16px">أدخل كلمة المرور الخاصة بالمدير للمتابعة</p>
    <input type="password" id="adminPasswordInput" class="in" placeholder="كلمة المرور (123456)" style="text-align:center;font-weight:800;letter-spacing:2px">
    <button class="gbtn" id="loginPassBtn">🔓 دخول لوحة التحكم</button>
  </div>
</div>

<div id="toast"></div>

<div id="app" style="display:none">
  <header>
    <div class="brand">
      <div><span class="brand-t">REAL STORE ADMIN</span><div class="sub">لوحة التحكم والسيطرة المركزية ⚡</div></div>
    </div>
    <button class="ibtn" id="adminLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
  </header>

  <div class="form">
    <div class="stats" id="stats">
      <div class="st"><span>إجمالي الطلبات</span><b id="stOrders">0</b></div>
      <div class="st"><span>إجمالي المبيعات</span><b id="stSales">0 ج.م</b></div>
    </div>

    <div style="background:var(--inner);border:1px solid var(--bd2);border-radius:14px;padding:12px;margin-bottom:14px">
      <b style="display:block;font-size:12.5px;color:var(--a);margin-bottom:8px">⚡ شحن رصيد للعميل عبر الـ ID</b>
      <input id="targetUid" class="in" placeholder="أدخل ID العميل (REAL-XXXXXX)" style="direction:ltr">
      <input id="targetAmount" class="in" type="number" placeholder="المبلغ المراد إضافته">
      <button class="copy" id="sendBalanceBtn" style="background:linear-gradient(135deg,#FFD700,#FF8A00);color:#382000">🚀 شحن رصيد العميل فوراً</button>
      <div id="feedback" style="font-size:11px;font-weight:700;margin-top:8px;min-height:16px"></div>
    </div>

    <div class="ttl">📦 إدارة ومتابعة الطلبات الواردة</div>
    <div id="adminOrdersList" style="font-size:11px">جاري التحميل...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
const firebaseConfig = {
  apiKey: "AIzaSyAMdGfiAhH1xmG0qETz3KU-nxhua1V4baM",
  authDomain: "real-store-c91ec.firebaseapp.com",
  databaseURL: "https://real-store-a99a0-default-rtdb.firebaseio.com",
  projectId: "real-store-c91ec",
  storageBucket: "real-store-c91ec.appspot.com",
  messagingSenderId: "315828860330",
  appId: "1:315828860330:web:3b2fb64a105ebb1ae627d3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const $ = s => document.querySelector(s);
const ADMIN_PASS = "123456";

function toast(m){ const e=$("#toast"); e.textContent=m; e.style.display="block"; setTimeout(()=>e.style.display="none",2500); }
const esc = s => String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const STATUS_MAP = {
  pending:{t:"في انتظار الدفع",c:"st-pending"},
  paid:{t:"تم استلام الدفع",c:"st-paid"},
  processing:{t:"جاري التنفيذ",c:"st-processing"},
  done:{t:"تم التنفيذ",c:"st-done"},
  rejected:{t:"مرفوض",c:"st-rejected"},
  cancelled:{t:"ملغي",c:"st-cancelled"}
};

if(localStorage.getItem("admin_logged") === "true"){
  $("#gate").style.display = "none";
  $("#app").style.display = "block";
  loadAdminDashboard();
}

$("#loginPassBtn").onclick = () => {
  const val = $("#adminPasswordInput").value.trim();
  if(val === ADMIN_PASS){
    localStorage.setItem("admin_logged", "true");
    $("#gate").style.display = "none";
    $("#app").style.display = "block";
    loadAdminDashboard();
    toast("✅ تم تسجيل الدخول بنجاح");
  } else {
    toast("❌ كلمة المرور غير صحيحة");
  }
};

$("#adminLogoutBtn").onclick = () => {
  localStorage.removeItem("admin_logged");
  $("#gate").style.display = "flex";
  $("#app").style.display = "none";
  $("#adminPasswordInput").value = "";
  toast("👋 تم تسجيل الخروج");
};

function loadAdminDashboard(){
  db.ref('orders').on('value', s => {
    const data = s.val()||{};
    let flat = [], totalSales = 0;
    Object.entries(data).forEach(([uid, orders])=>{
      Object.entries(orders||{}).forEach(([oid,o])=>{
        flat.push({uid, oid, ...o});
        if(o.status === 'done') totalSales += (o.total||0);
      });
    });
    flat.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    
    $("#stOrders").textContent = flat.length;
    $("#stSales").textContent = totalSales.toFixed(2) + " ج.م";

    if(!flat.length){
      $("#adminOrdersList").innerHTML = '<p class="sub" style="text-align:center;padding:15px">لا توجد طلبات حتى الآن</p>';
      return;
    }

    $("#adminOrdersList").innerHTML = flat.map(o=>`
      <div class="order-card">
        <div class="oc-top"><b>${esc(o.oid)}</b><span class="status-pill ${(STATUS_MAP[o.status]||STATUS_MAP.pending).c}">${(STATUS_MAP[o.status]||STATUS_MAP.pending).t}</span></div>
        <small style="color:var(--sub)">العميل: ${esc(o.name||"زائر")} (${esc(o.uid)}) • ${new Date(o.createdAt||Date.now()).toLocaleString('ar-EG')}</small>
        <div style="font-size:11.5px;margin:6px 0">${(o.items||[]).map(it=>`• ${esc(it.title)} ×${it.qty||1}`).join("<br>")}</div>
        <b style="color:var(--gold)">الإجمالي: ${o.total||0} ج.م</b>
        <select onchange="updateStatus('${esc(o.uid)}','${esc(o.oid)}',this.value)" style="width:100%;margin-top:8px;padding:7px;border-radius:10px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-size:11px">
          ${Object.entries(STATUS_MAP).map(([k,v])=>`<option value="${k}" ${o.status===k?"selected":""}>${v.t}</option>`).join("")}
        </select>
      </div>`).join("");
  });
}

window.updateStatus = function(uid, oid, status){
  db.ref('orders/'+uid+'/'+oid+'/status').set(status).then(()=>{
    db.ref('notifications/'+uid+'/'+('st_'+Date.now())).set({
      title:"تحديث حالة الطلب",
      body:"تم تغيير حالة طلبك "+oid+" إلى: "+(STATUS_MAP[status]||{}).t,
      time:Date.now(),
      read:false
    }).catch(()=>{});
    toast("✅ تم تحديث الحالة وإشعار العميل");
  }).catch(err=>toast("❌ " + err.message));
};

$("#sendBalanceBtn").onclick = () => {
  const targetId = $("#targetUid").value.trim();
  const amount = parseFloat($("#targetAmount").value);
  const fb = $("#feedback");
  if(!targetId){ fb.style.color="#EF4444"; fb.textContent="❌ أدخل ID العميل"; return; }
  if(!amount || isNaN(amount)){ fb.style.color="#EF4444"; fb.textContent="❌ أدخل مبلغ صحيح"; return; }
  
  const ref = db.ref('users/'+targetId+'/wallet');
  ref.once('value').then(s=>{
    const cur = s.val()||0, nw = cur + amount;
    ref.set(nw).then(()=>{
      fb.style.color = "var(--ok)";
      fb.textContent = `✅ شُحن (${amount} ج.م) بنجاح للـ ID: (${targetId}) | الرصيد الجديد: (${nw} ج.م)`;
      toast("🚀 تم شحن رصيد العميل");
      $("#targetUid").value=""; $("#targetAmount").value="";
    }).catch(err=>{ fb.style.color="#EF4444"; fb.textContent="❌ " + err.message; });
  });
};
</script>
</body>
</html>
