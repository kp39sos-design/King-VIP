function renderGame(g){const c=document.getElementById('pricesContainer');let items=[],title='';if(g==='pubg'){items=pubgItems;title='PUBG MOBILE';let h='<div class="category-title"><img src="https://www.image2url.com/r2/default/images/1787234418964-76e68daf-ff7e-448f-987f-052d946d37ca.webp" alt="PUBG" onclick="openLightbox(this.src)">'+title+'</div>';items.forEach(i=>h+=createCardHTML(i.name,i.price,title,!1));c.innerHTML=h;attachOrderEvents(c);return;}else if(g==='mlbb'){items=mlbbItems;title='Mobile Legends';let h='<div class="category-title"><img src="https://www.image2url.com/r2/default/images/1787234994077-9bd1c6d4-0170-40cb-803c-2832266d2102.jpg" alt="MLBB" onclick="openLightbox(this.src)">'+title+'</div>';items.forEach(i=>h+=createCardHTML(i.name,i.price,title,!1));c.innerHTML=h;attachOrderEvents(c);return;}else if(g==='freefire'){items=freefireItems;title='Free Fire';let h='<div class="category-title"><img src="https://www.image2url.com/r2/default/images/1787234654157-8837d1ff-65f5-4fac-8b04-46be4b2e520f.webp" alt="Free Fire" onclick="openLightbox(this.src)">'+title+'</div>';items.forEach(i=>h+=createCardHTML(i.name,i.price,title,!1));c.innerHTML=h;attachOrderEvents(c);return;}else if(g==='gangstar'){items=gangstarItems;title='Gangstar Mirage City';let h='<div class="category-title"><img src="https://www.image2url.com/r2/default/images/1787234202116-f80a24ea-ce64-404e-b0fb-27a6517bdcc3.webp" alt="Gangstar" onclick="openLightbox(this.src)">'+title+'</div>';items.forEach(i=>h+=createCardHTML(i.name,i.price,title,!1));c.innerHTML=h;attachOrderEvents(c);return;}else if(g==='yallaludo'){let h='<div class="category-title"><img src="https://www.image2url.com/r2/default/images/1787235159508-838a2af2-8b90-4e88-8190-187a33fd36e7.png" alt="يلا لودو" onclick="openLightbox(this.src)"> يلا لودو - حساب</div>';yallaAccountItems.forEach(i=>h+=createCardHTML(i.name,i.price,'يلا لودو',!1));h+='<div class="category-title"><img src="https://www.image2url.com/r2/default/images/1787235159508-838a2af2-8b90-4e88-8190-187a33fd36e7.png" alt="يلا لودو" onclick="openLightbox(this.src)"> يلا لودو - ID</div>';yallaIdItems.forEach(i=>h+=createCardHTML(i.name,i.price,'يلا لودو',!1));h+='<div class="category-title" style="border-right-color:#ff8800;background:rgba(255,136,0,.05);"><i class="fas fa-crown" style="color:#ff8800;"></i> شحن VIP</div>';yallaVipItems.forEach(i=>h+=createCardHTML(i.name,i.price,'VIP',!0));c.innerHTML=h;attachOrderEvents(c);return;}else if(g==='tiktok'){items=tiktokItems;title='TikTok Coins';let h='<div class="category-title"><img src="https://www.image2url.com/r2/default/images/1787235314525-3b37b8c8-b3ca-47b3-a43f-4920261f933d.png" alt="TikTok" onclick="openLightbox(this.src)">'+title+'</div>';items.forEach(i=>h+=createCardHTML(i.name,i.price,title,!1));c.innerHTML=h;attachOrderEvents(c);return;}else if(g==='weplay'){let h='<div class="category-title"><i class="fas fa-gamepad" style="color:#00d4ff;"></i> 🎮 WePlay - العملات</div>';weplayCoinItems.forEach(i=>h+=createCardHTML(i.name,i.price,'WePlay',!1));h+='<div class="category-title" style="border-right-color:#ff8800;"><i class="fas fa-ticket-alt" style="color:#ff8800;"></i> بطاقة المرح</div>';weplayFunCardItems.forEach(i=>h+=createCardHTML(i.name,i.price,'بطاقة مرح',!1));h+='<div class="category-title" style="border-right-color:#ff007f;background:rgba(255,0,127,.05);"><i class="fas fa-crown" style="color:#ff007f;"></i> مركز VIP</div>';weplayVipItems.forEach(i=>h+=createCardHTML(i.name,i.price,'VIP',!0));c.innerHTML=h;attachOrderEvents(c);return;}else return;let h='<div class="category-title"><i class="fas fa-gamepad"></i> '+title+'</div>';items.forEach(i=>h+=createCardHTML(i.name,i.price,title,!1));c.innerHTML=h;attachOrderEvents(c);}
let rechargePhone='',rechargeAmount=50;
function renderRecharge(k){const c=document.getElementById('rechargeContainer'),names={vodafone:'فودافون',etisalat:'اتصالات',we:'وي',wehome:'WE منزلي'},name=names[k]||'شحن';c.innerHTML='<div class="recharge-tool"><h3><i class="fas fa-bolt" style="color:#ff007f;"></i> شحن '+name+' سريع</h3><p style="color:#8a8aa0;margin-bottom:.5rem;">أدخل رقم الهاتف واختر المبلغ</p><div class="input-group"><input type="tel" id="rechargePhoneInput" placeholder="رقم الهاتف (مثال 010...)" dir="ltr"><input type="number" id="rechargeAmountInput" placeholder="المبلغ بالجنيه" value="50" min="1" dir="ltr"></div><div class="quick-amounts"><button onclick="setQuickAmount(10)">10 ج</button><button onclick="setQuickAmount(20)">20 ج</button><button onclick="setQuickAmount(50)">50 ج</button><button onclick="setQuickAmount(100)">100 ج</button><button onclick="setQuickAmount(200)">200 ج</button></div><div class="total-display" id="rechargeTotalDisplay">'+(50*.95).toFixed(2)+' <span>جنيه (بعد خصم 5%)</span></div><p class="recharge-fee-note"><i class="fas fa-info-circle"></i> رسوم خدمة 5% فقط، والباقي يضاف رصيدك</p><button class="btn-recharge" onclick="requestRecharge(\''+name+'\')"><i class="fas fa-check-circle"></i> اطلب الشحن الآن</button><p style="margin-top:.5rem;font-size:.8rem;color:#5a5a70;"><i class="fas fa-lock"></i> سيتم توجيهك للدفع عبر فودافون كاش</p></div>';const p=document.getElementById('rechargePhoneInput'),a=document.getElementById('rechargeAmountInput');if(p)p.addEventListener('input',e=>rechargePhone=e.target.value);if(a){a.addEventListener('input',e=>{let v=parseFloat(e.target.value)||0;if(v<1)v=1;rechargeAmount=v;updateRechargeDisplay(v);});rechargeAmount=50;updateRechargeDisplay(50);}}
function setQuickAmount(v){rechargeAmount=v;const i=document.getElementById('rechargeAmountInput');if(i)i.value=v;updateRechargeDisplay(v);}
function updateRechargeDisplay(a){const d=document.getElementById('rechargeTotalDisplay');if(!d)return;d.innerHTML=(a*.95).toFixed(2)+' <span>جنيه (بعد خصم 5%)</span>';}
function requestRecharge(p){const phone=document.getElementById('rechargePhoneInput')?.value.trim(),amount=parseFloat(document.getElementById('rechargeAmountInput')?.value)||0;if(!phone||phone.length<10){showToast('⚠️ يرجى إدخال رقم هاتف صحيح');return;}if(amount<1){showToast('⚠️ يرجى إدخال مبلغ صحيح');return;}const after=(amount*.95).toFixed(2);openOrderModal('شحن '+p+' - '+phone+' ('+amount+' ج, يصلك '+after+' ج)',amount);}
function renderShabab(k){const d=shababData[k];if(!d)return;const c=document.getElementById('shababContainer');let h='<div class="category-title"><i class="fas fa-coins"></i> كونات شباب - '+d.flag+' '+d.currency+'</div>';d.items.forEach(i=>{let pf=i.price.toLocaleString('eg-EG'),cf=i.coins.toLocaleString('eg-EG');h+='<div class="price-card vip-card shabab-card"><div class="game-badge vip-badge"><i class="fas fa-star"></i> شباب كونات</div><div class="price-eg">'+pf+' <span style="font-size:.9rem;">'+d.currency+'</span></div><div class="item-name">'+cf+' <span style="font-size:1rem;color:#8a8aa0;">كون</span></div><div class="sub-text">💰 المبلغ المطلوب دفعه للحصول على هذه الكونات</div><button class="btn-order" data-item="'+i.price+' '+d.currency+' → '+cf+' كون" data-price="'+i.price+'"><i class="fas fa-shopping-cart"></i> اطلب الآن</button></div>';});c.innerHTML=h;attachOrderEvents(c);}
let currentOrderItem='',currentOrderPrice=0;

function openMissingModal(){document.getElementById('missingModal').classList.add('show');}

function copyText(t){navigator.clipboard.writeText(t).then(()=>showToast('✅ تم نسخ: '+t));}

(function(){const s=document.getElementById('splashScreen'),t=document.getElementById('splashTimer'),sk=document.getElementById('skipSplash'),avatar=document.getElementById('avatarWrapper');let sec=10,interv;function hide(){s.classList.add('hidden');clearInterval(interv);avatar.classList.add('show');}interv=setInterval(()=>{sec--;if(sec<=0){clearInterval(interv);t.textContent='0 ثواني';hide();}else t.textContent=sec+' ثواني';},1000);sk.addEventListener('click',hide);setTimeout(hide,10000);})();
