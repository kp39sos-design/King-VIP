<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="متجر شحن الألعاب الأسرع والأرخص: PUBG, Free Fire, Mobile Legends, TikTok, Roblox وبطاقات هدايا">
<meta name="theme-color" content="#2563EB">
<title>استور أسرع من نتكم | شحن جميع الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#F1F5F9;--card:rgba(255,255,255,.92);--inner:rgba(241,245,249,.9);--bd:rgba(37,99,235,.18);--bd2:rgba(37,99,235,.4);--tx:#0F172A;--sub:#475569;--a:#2563EB;--b:#7C3AED;--gold:#D97706;--ok:#16A34A;--g1:linear-gradient(135deg,#2563EB,#7C3AED);--g2:linear-gradient(135deg,#F59E0B,#D97706);--sh:0 8px 18px -4px rgba(0,0,0,.08);--modal:#fff}
[data-theme=dark]{--bg:#080A0F;--card:rgba(17,21,29,.88);--inner:rgba(8,10,15,.7);--bd:rgba(0,217,255,.15);--bd2:rgba(0,217,255,.4);--tx:#fff;--sub:#A7B0C0;--a:#00D9FF;--b:#8B5CF6;--gold:#FFB800;--ok:#22C55E;--g1:linear-gradient(135deg,#00D9FF,#8B5CF6);--g2:linear-gradient(135deg,#FFD700,#FF8A00);--sh:0 12px 24px -6px rgba(0,0,0,.8);--modal:#11151D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#030407;color:var(--tx);font-family:Cairo,sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;padding:12px 10px}
button,input,textarea{font-family:inherit}button{border:0;cursor:pointer}a{text-decoration:none;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.brand-t{background:linear-gradient(135deg,var(--tx),var(--a),var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;font-size:13px;cursor:pointer}
.sub{font-size:9px;font-weight:600;color:var(--sub)}
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:85px;height:85px;border-radius:22px;border:1px solid var(--a)}
.skip{background:var(--g1);color:#fff;padding:9px 24px;border-radius:22px;font-weight:800;font-size:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:6px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--a);object-fit:cover}
.ctl{display:flex;gap:4px;align-items:center}
.ibtn{height:30px;min-width:30px;padding:0 7px;border-radius:50px;background:var(--card);color:var(--a);border:1px solid var(--bd);font-size:10px;font-weight:800;box-shadow:var(--sh)}
.live{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--ok);padding:3px 7px;border-radius:12px;font-size:9px;font-weight:800}
select.ibtn{appearance:none;background:var(--card);color:var(--a)}
.social{display:flex;gap:8px;margin:8px 0}
.soc{flex:1;text-align:center;padding:8px;border-radius:12px;font-size:11px;font-weight:800;border:1px solid var(--bd2);color:var(--a);background:var(--inner)}
.soc.w{color:var(--ok)}
.search{position:relative;margin:6px 0 10px}
.search input{width:100%;padding:10px 36px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:12px}
.search i{position:absolute;top:50%;transform:translateY(-50%);color:var(--a);inset-inline-start:13px;font-size:13px}
.tabs,.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}
.tab,.subtab{flex-shrink:0;background:var(--card);color:var(--sub);border:1px solid var(--bd);padding:8px 14px;border-radius:14px;font-weight:800;font-size:11.5px}
.subtab{padding:6px 12px;font-size:10.5px;border-radius:16px}
.tab.on,.subtab.on{background:var(--g1);color:#fff;border-color:transparent}
.sec{display:none}.sec.on{display:block;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ttl{font-size:15px;font-weight:900;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gw{display:flex;flex-direction:column}.gw.open{grid-column:span 2}
.gc{background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.gi{height:120px;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle,rgba(37,99,235,.15),#0b0f19 70%)}
.gi::before{content:"";position:absolute;width:70px;height:70px;background:var(--gl);filter:blur(25px);opacity:.6}
.gi img{width:82px;height:82px;object-fit:contain;border-radius:16px;position:relative}
.gn{padding:10px 12px}
.gn b{display:block;font-size:12px;color:#fff}.gn small{display:block;color:#94a3b8;font-size:9.5px;margin:2px 0 8px;font-weight:600}
.open-b{width:100%;background:var(--g1);color:#fff;padding:8px;border-radius:10px;font-weight:800;font-size:10.5px}
.pk{display:none;margin-top:8px;background:var(--inner);border:1px solid var(--bd2);border-radius:16px;padding:10px}
.gw.open .pk{display:block;animation:fi .3s}
.pr{background:var(--card);border:1px solid var(--bd2);border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh)}
.pn{font-weight:800;font-size:10.5px;min-height:26px;display:flex;align-items:center;line-height:1.3}
.pp{background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.28);color:var(--gold);padding:5px 7px;border-radius:10px;font-size:11.5px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:4px;margin:5px 0 6px}
.pp small{font-size:8.5px;opacity:.85}.pp img{width:18px;height:18px;object-fit:contain;vertical-align:middle}
.buy{width:100%;background:var(--g2);color:#fff;border-radius:8px;padding:7px;font-weight:900;font-size:10.5px}
.buy:active,.open-b:active,.copy:active{transform:scale(.95)}
.pay,.form{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:14px;box-shadow:var(--sh)}
.pay h3{font-size:13.5px;margin-bottom:8px}
.num{background:var(--inner);border:1px solid var(--bd2);border-radius:12px;padding:10px;font-size:16px;font-weight:900;direction:ltr;text-align:center;letter-spacing:1.5px;color:var(--a)}
.copy{width:100%;margin-top:8px;background:var(--g1);color:#fff;padding:9px;border-radius:10px;font-weight:800;font-size:12px}
.wa{display:block;text-align:center;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;padding:10px;border-radius:10px;margin-top:8px;font-weight:800;font-size:12px;width:100%}
.in{width:100%;background:var(--inner);border:1px solid var(--bd);color:var(--tx);padding:10px;border-radius:12px;margin-bottom:8px;font-size:12px}
textarea.in{min-height:75px;resize:none}
.soon{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px 8px;text-align:center}
.sc i{font-size:24px;color:var(--b);margin-bottom:6px}.sc h3{font-size:12.5px}.sc p{font-size:9.5px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.st{background:var(--inner);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.st b{display:block;font-size:18px;color:var(--a)}.st span{font-size:10px;color:var(--sub)}
.modal{position:fixed;inset:0;z-index:98;background:rgba(3,4,7,.65);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:10px}
.modal.on{display:flex}
.mb{width:100%;max-width:460px;max-height:90vh;overflow-y:auto;background:var(--modal);border:1px solid var(--bd2);border-radius:20px;padding:16px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h2{font-size:15px}
.x{width:30px;height:30px;border-radius:50%;background:var(--inner);color:var(--tx);font-size:16px}
.info{background:var(--inner);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.info small{color:var(--sub);font-size:10px}.info b{display:block;font-size:13px}
.disc{border:1px dashed var(--gold);border-radius:12px;padding:12px;text-align:center;margin-bottom:8px}
.disc .n{font-size:20px;font-weight:900;color:var(--gold)}.disc .o{font-size:11px;color:var(--sub);text-decoration:line-through}
.order{width:100%;background:var(--g2);color:#fff;padding:11px;border-radius:12px;font-weight:900;font-size:12px}
.err{border-color:#EF4444!important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;background:var(--modal);border:1px solid var(--a);color:var(--tx);padding:8px 18px;border-radius:20px;font-weight:800;font-size:11px;display:none;white-space:nowrap}
footer{text-align:center;padding:20px 8px 12px;color:var(--sub);font-size:10px;font-weight:600}
footer .fs{display:flex;justify-content:center;gap:16px;margin-top:8px;font-size:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 3D احترافي + أداء ===== */
body{background:radial-gradient(circle at 50% 0,#0b1224,#030407 70%)}
#app{box-shadow:0 0 60px rgba(37,99,235,.25)}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.gc,.pr,.sc,.st,.pay,.form,.info,.tab,.subtab,.ibtn,.soc{transform-style:preserve-3d;transition:transform .2s ease,box-shadow .2s ease}
.gc{box-shadow:0 14px 24px -8px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.12) inset,0 -4px 0 rgba(0,0,0,.35) inset;border:1px solid rgba(255,255,255,.1)}
.gc:hover{transform:translateY(-4px) perspective(700px) rotateX(3deg)}
.gi img{filter:drop-shadow(0 12px 12px rgba(0,0,0,.6));transform:translateZ(30px)}
.pr{background:linear-gradient(160deg,var(--card),var(--inner));box-shadow:0 10px 18px -6px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.5) inset,0 -3px 0 rgba(0,0,0,.08) inset}
.pr:hover{transform:translateY(-3px) perspective(700px) rotateX(2deg)}
.buy,.open-b,.copy,.order,.wa,.skip,.tab.on,.subtab.on{box-shadow:0 5px 0 rgba(0,0,0,.28),0 10px 16px -4px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s}
.buy:active,.open-b:active,.copy:active,.order:active,.wa:active,.skip:active{transform:translateY(4px)!important;box-shadow:0 1px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.tab,.subtab{box-shadow:0 4px 0 rgba(0,0,0,.12),0 6px 10px -4px rgba(0,0,0,.2)}
.pp{box-shadow:inset 0 2px 5px rgba(0,0,0,.12)}
.mb{box-shadow:0 30px 60px -10px rgba(0,0,0,.7),0 0 0 1px var(--bd2),inset 0 1px 0 rgba(255,255,255,.12)}
.modal{background:rgba(3,4,7,.8)}
.pk{content-visibility:auto}
.avatar{box-shadow:0 6px 14px rgba(37,99,235,.5)}

/* ===== REAL STORE - NEON ROYAL COLOR SYSTEM ===== */
:root{color-scheme:light;--bg:#F4F6FF;--card:#FFFFFF;--inner:#EDF1FF;--tx:#151B35;--sub:#68738D;--a:#2563EB;--b:#9333EA;--gold:#D99B16;--ok:#16A34A;--bd:rgba(37,99,235,.18);--bd2:rgba(147,51,234,.38);--g1:linear-gradient(135deg,#2563EB,#9333EA);--g2:linear-gradient(135deg,#FFD166,#F59E0B);--modal:#FFFFFF;--neon-blue:#2563EB;--neon-purple:#9333EA;--neon-cyan:#06B6D4;--neon-pink:#EC4899;--neon-orange:#F97316;--neon-green:#22C55E}
[data-theme="dark"]{color-scheme:dark;--bg:#080B18;--card:#12182B;--inner:#0C1224;--tx:#F8FAFF;--sub:#A1AEC8;--a:#38BDF8;--b:#A78BFA;--gold:#FFD166;--ok:#34D399;--bd:rgba(56,189,248,.20);--bd2:rgba(167,139,250,.45);--g1:linear-gradient(135deg,#0284C7,#7C3AED);--g2:linear-gradient(135deg,#FFD700,#FF8A00);--modal:#12182B;--neon-blue:#38BDF8;--neon-purple:#A78BFA;--neon-cyan:#22D3EE;--neon-pink:#F472B6;--neon-orange:#FB923C;--neon-green:#34D399}
body{background:radial-gradient(circle at 15% 10%,#172554 0,transparent 35%),radial-gradient(circle at 85% 80%,#3B0764 0,transparent 35%),#030712}
#app{background-color:var(--bg);background-image:radial-gradient(circle at 0 0,rgba(6,182,212,.10),transparent 35%),radial-gradient(circle at 100% 100%,rgba(147,51,234,.12),transparent 40%);box-shadow:0 0 45px rgba(37,99,235,.15),0 0 90px rgba(147,51,234,.08)}
header{background:var(--card);border:1px solid var(--bd2);box-shadow:0 8px 25px rgba(37,99,235,.08)}
.brand-t{background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.avatar{border-color:var(--a);box-shadow:0 0 15px rgba(56,189,248,.35)}
.soc{background:var(--card);border:1px solid var(--bd2)}
.soc:first-child{color:#229ED9}.soc.w{color:#22C55E}
.soc:hover{transform:translateY(-3px);box-shadow:0 0 18px rgba(56,189,248,.20)}
.search input{background:var(--card);border:1px solid var(--bd);color:var(--tx)}
.search input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(56,189,248,.15);outline:none}
.tab,.subtab{background:var(--card);color:var(--sub);border:1px solid var(--bd)}
.tab.on,.subtab.on{background:var(--g1);color:#fff;border-color:transparent;box-shadow:0 5px 15px rgba(37,99,235,.25),0 0 12px rgba(147,51,234,.15)}
.tab:hover,.subtab:hover{border-color:var(--a)}
.gc{background:linear-gradient(145deg,#172554,#111827);border:1px solid rgba(56,189,248,.20);box-shadow:0 12px 25px rgba(0,0,0,.35),0 0 15px rgba(56,189,248,.08)}
.gi{background:radial-gradient(circle at center,rgba(56,189,248,.20),transparent 65%),#0B1020}
.gi::before{opacity:.8;filter:blur(30px)}
.gn b{color:#fff}.gn small{color:#A5B4D0}
#w-pubg{--game-color:#FFB800}#w-mlbb{--game-color:#00D9FF}#w-ff{--game-color:#FF5722}#w-yalla{--game-color:#3B82F6}#w-tiktok{--game-color:#FE2C55}#w-gangstar{--game-color:#A855F7}#w-weplay{--game-color:#EC4899}#w-roblox{--game-color:#EF4444}
.gw .gc{border-color:rgba(56,189,248,.35);border-color:color-mix(in srgb,var(--game-color,#38BDF8) 35%,transparent)}
.gw .gi{background:radial-gradient(circle,var(--game-color,#38BDF8) 0%,transparent 65%),#0B1020}
.gw .gi::before{background:var(--game-color,#38BDF8)}
.gw .gc:hover{box-shadow:0 12px 25px rgba(0,0,0,.4),0 0 22px rgba(56,189,248,.35);box-shadow:0 12px 25px rgba(0,0,0,.4),0 0 22px color-mix(in srgb,var(--game-color,#38BDF8) 35%,transparent)}
.open-b{background:linear-gradient(135deg,#0284C7,#7C3AED);color:#fff}
.open-b:hover{filter:brightness(1.15)}
.pr{background:linear-gradient(145deg,var(--card),var(--inner));border:1px solid var(--bd2);box-shadow:0 8px 20px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.12)}
.pn{color:var(--tx)}
.pp{background:linear-gradient(135deg,rgba(255,209,102,.15),rgba(245,158,11,.08));border:1px solid rgba(245,158,11,.35);color:var(--gold)}
.pp small{color:var(--sub)}
.buy,.order{background:linear-gradient(135deg,#FFD166,#F59E0B);color:#382000;text-shadow:none;box-shadow:0 5px 0 #B66A08,0 8px 15px rgba(245,158,11,.20)}
.buy:hover,.order:hover{filter:brightness(1.12)}
.pay,.form{background:var(--card);border:1px solid var(--bd)}
.copy{background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff}
.wa{background:linear-gradient(135deg,#22C55E,#15803D);color:#fff;box-shadow:0 5px 15px rgba(34,197,94,.20)}
.in{background:var(--inner);border:1px solid var(--bd);color:var(--tx)}
.in:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(56,189,248,.15);outline:none}
.sc{background:var(--card);border:1px solid var(--bd)}
.sc i{background:linear-gradient(135deg,#06B6D4,#9333EA);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.st{background:var(--inner);border:1px solid var(--bd)}.st b{color:var(--a)}
.ttl{color:var(--tx);border-inline-start:4px solid var(--a);padding-inline-start:9px}
.live{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.35)}
.modal{background:rgba(2,6,23,.85)}
.mb{background:var(--modal);border:1px solid var(--bd2);box-shadow:0 25px 70px rgba(0,0,0,.55),0 0 30px rgba(56,189,248,.12)}
.info{background:var(--inner);border:1px solid var(--bd)}
.disc{background:rgba(245,158,11,.08);border:1px dashed var(--gold)}.disc .n{color:var(--gold)}
#toast{background:var(--modal);color:var(--tx);border:1px solid var(--a);box-shadow:0 0 20px rgba(56,189,248,.25)}
footer{color:var(--sub)}
#splash{background:var(--bg)}
#splash img{border:2px solid var(--a);box-shadow:0 0 25px rgba(56,189,248,.25)}
.skip{background:var(--g1);color:#fff}
@keyframes neonPulse{0%,100%{box-shadow:0 0 8px rgba(56,189,248,.10)}50%{box-shadow:0 0 20px rgba(147,51,234,.25)}}
@media(min-width:481px){.gc:hover{animation:neonPulse 2s infinite}}
@media(max-width:480px){.gc:hover,.pr:hover{transform:none}}

/* ===== صور موحدة + أزرار خفيفة وسريعة ===== */
.gi{height:116px;padding:0}
.gi::before{width:92px;height:92px;opacity:.45;filter:blur(26px)}
.gi img{width:84px;height:84px;aspect-ratio:1/1;object-fit:cover;object-position:center;border-radius:20px;border:2px solid rgba(255,255,255,.25);background:#0B1020;box-shadow:0 10px 20px rgba(0,0,0,.5);transform:none;filter:none}
button,.soc,.wa,.tab,.subtab{touch-action:manipulation;transition:filter .1s,transform .1s}
.buy,.open-b,.copy,.order,.wa,.skip{box-shadow:0 2px 8px rgba(0,0,0,.25);border-radius:10px}
.buy{box-shadow:0 2px 8px rgba(245,158,11,.35)}
.tab,.subtab,.tab.on,.subtab.on{box-shadow:none}
.buy:active,.open-b:active,.copy:active,.order:active,.wa:active,.skip:active{transform:scale(.96)!important;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.modal.on .mb{animation:none}
.gc,.pr{transition:none}
/* ===== صورة شفافة خلف صورة اللعبة ===== */
.gi{overflow:hidden}
.gi::before{display:none}
.gi .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.6);filter:blur(16px) saturate(1.5);opacity:.38;border:0;border-radius:0;box-shadow:none;background:none;pointer-events:none}
.gi::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(11,16,32,.65));pointer-events:none}
.gi img:not(.ghost){position:relative;z-index:2}
/* ===== بوت ذكي ===== */
#botDock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:90;pointer-events:none}
#botFab{pointer-events:auto;position:absolute;bottom:16px;inset-inline-end:14px;width:56px;height:56px;border-radius:50%;background:var(--g1);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(37,99,235,.45);animation:botPulse 2.4s infinite}
@keyframes botPulse{0%,100%{box-shadow:0 8px 20px rgba(37,99,235,.45),0 0 0 0 rgba(56,189,248,.5)}50%{box-shadow:0 8px 20px rgba(37,99,235,.45),0 0 0 12px rgba(56,189,248,0)}}
#botPanel{pointer-events:auto;display:none;flex-direction:column;height:min(80vh,580px);background:var(--modal);border:1px solid var(--bd2);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);overflow:hidden}
#botPanel.on{display:flex}
.bh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--g1);color:#fff}

  // إعدادات Firebase الخاصة بمتجر REAL STORE
  const firebaseConfig = {
    apiKey: "AIzaSyD-REALSTORE-API-KEY-PLACEHOLDER",
    authDomain: "kp39sos-design.github.io",
    projectId: "real-store-project",

  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();

  // نظام حماية وشاشة تسجيل الدخول الإجبارية
  auth.onAuthStateChanged(user => {
    const overlay = document.getElementById("authOverlay");
    if (user) {
      // المستخدم مسجل دخوله بنجاح
      overlay.classList.add("hide");
      document.getElementById("userName").textContent = user.displayName || "مستخدم REAL STORE";

      }

      // لم يتم تسجيل الدخول -> إظهار شاشة الحماية
      overlay.classList.remove("hide");
    }
  });

  // زر تسجيل الدخول باستخدام Google
  document.getElementById("googleLoginBtn").onclick = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(error => {
      alert("خطأ في تسجيل الدخول: " + error.message);
    });
  };

  // زر تسجيل الخروج
  document.getElementById("logoutBtn").onclick = () => {
    auth.signOut().then(() => {
      location.reload();
    });
  };
</script>

let sel=null;
function openOrder(i){
  sel=REG[i];const hasP=sel.base!=null;
  $("#mProd").textContent=sel.title;
  $("#mDisc").style.display=hasP||true?"block":"none";
  if(hasP&&sel.title.indexOf("شباب كونات")!==0){
    $("#mPrice").textContent=fmtPrice(sel.base*(1-CFG.discount))+" "+CFG.cur[lang];
    $("#mOld").textContent=t("orig")+fmtPrice(sel.base)+" "+CFG.cur[lang];$("#mOld").style.display="block";
  }else{$("#mPrice").textContent=sel.label;$("#mOld").style.display="none"}
  $("#mNeedBox").style.display=sel.need?"block":"none";
  $("#mNeedLbl").textContent=sel.need==="phone"?t("need_phone"):t("need_id");
  $("#mNeed").value=sel.need==="id"?store.get("lastId",""):"";$("#mNeed").classList.remove("err");
  
  $("#modal").classList.add("on");
  if(sel.need&&!$("#mNeed").value)setTimeout(()=>$("#mNeed").focus(),30);
}
const closeModal=()=>$("#modal").classList.remove("on");
function confirmOrder(){
  const need=$("#mNeed").value.trim();
  if(sel.need&&need.length<3){$("#mNeed").classList.add("err");$("#mNeed").focus();toast(t("need_req"));return}
  const priceTxt=$("#mDisc").style.display==="none"?"":$("#mPrice").textContent;
  let msg=t("hello")+"\n\n"+t("want")+sel.title+"\n"+t("pricel")+priceTxt;
  if(sel.need)msg+="\n"+t("idl")+need;
  msg+="\n\n"+t("from")+CFG.storeName+" 🔥";
  if(sel.need==="id")store.set("lastId",need);stat.inc("ord");openWA(msg);closeModal();
}
function sendRequest(){
  const v=id=>$("#"+id).value.trim(),name=v("rName"),phone=v("rPhone");
  if(!name)return toast(t("bad_name"));
  if(!/^[+\d\s-]{8,20}$/.test(phone))return toast(t("bad_phone"));
  openWA(t("hello")+"\n\n"+t("reqt")+CFG.storeName+" 🔥\n\n"+t("pl")+name+"\n"+t("tl")+v("rType")+"\n"+t("phl")+phone+"\n"+t("dl")+v("rDet"));
}

function priceAnswer(q,en){
  let g=Object.keys(GK).find(id=>kw(q,GK[id])),c=Object.keys(CK).find(id=>kw(q,CK[id]));
  const nums=q.match(/\d+(?:\.\d+)?/g)||[],cur=CFG.cur[lang],f=p=>fmtPrice(p*(1-CFG.discount))+" "+cur;
  let name,items;
  if(g){name=GAMES[g].n;items=GAMES[g].items}else if(c){name=CARDS[c].n;items=CARDS[c].items}else return null;
  const m=nums.length?items.filter(([l])=>(l.match(/\d+(?:\.\d+)?/g)||[]).includes(nums[0])):[];
  let txt;
  if(m.length)txt=(en?"Prices for ":"أسعار ")+name+(en?" (after 5% discount):\n":" (بعد خصم 5%):\n")+m.slice(0,4).map(([l,p])=>"• "+l+" ← "+f(p)).join("\n");
  else{const ps=items.map(i=>i[1]);txt=name+(en?`: ${items.length} packages from ${f(Math.min(...ps))} to ${f(Math.max(...ps))} (after 5% discount).\nOpen the packages to see all.`:`: ${items.length} باقة من ${f(Math.min(...ps))} إلى ${f(Math.max(...ps))} (بعد خصم 5%).\nافتح الباقات وشوف الكل.`)}
  return{txt,go:[[g?"game:"+g:"sec:cards",(en?"View ":"عرض ")+name]]};
}
function botReply(raw){
  const q=norm(raw),en=!hasAr(raw);
  if(!q)return null;
  const pr=(kw(q,["سعر","بكام","كام","اسعار","price","prices","cost","how much"])||/\d/.test(q))?priceAnswer(q,en):null;
  if(pr)return pr;
  const hit=KB.find(e=>kw(q,e.k.map(norm)));
  if(hit){return{txt:en?hit.en:hit.ar,go:(hit.go||[]).map(([a,l])=>[a,l]),chips:hit.chips}}
  const g2=priceAnswer(q,en);if(g2)return g2;
  return{txt:en?"I didn't quite get that 🤔 Try asking about prices, how to order, payment, delivery, or who owns the site — or contact support.":"مفهمتش سؤالك كويس 🤔 جرّب تسأل عن الأسعار، طريقة الطلب، الدفع، التسليم، أو صاحب الموقع — أو كلم الدعم.",go:[["wa",en?"💬 Contact support":"💬 كلم الدعم"]]};
}
const bm=$("#botMsgs");
function botAdd(who,txt,go){
  const d=document.createElement("div");d.className="bm "+who;d.textContent=txt;
  (go||[]).forEach(([a,l])=>{const b=document.createElement("button");b.className="bgo";b.dataset.bot=a;b.textContent=l;d.appendChild(b)});
  bm.appendChild(d);bm.scrollTop=bm.scrollHeight;
}
function botChips(list){
  $("#botChips").innerHTML=list.map(c=>`<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("");
}
function botAsk(text){
  text=text.trim().slice(0,200);if(!text)return;
  botAdd("u",text);const r=botReply(text);
  setTimeout(()=>{botAdd("b",r.txt,r.go);if(r.chips)botChips(r.chips)},250);
}
function botInit(){
  const u=BUI[lang]||BUI.ar;
  $("#botSub").textContent=u.sub;$("#botIn").placeholder=u.ph;
  bm.innerHTML="";botAdd("b",u.hi);botChips(u.chips);
}
function botToggle(on){
  $("#botPanel").classList.toggle("on",on);$("#botFab").style.display=on?"none":"flex";
  if(on&&!bm.children.length)botInit();
  if(on)setTimeout(()=>$("#botIn").focus(),50);
}
function botGo(a){
  if(a==="wa"){openWA(t("hello"));return}
  if(a==="fb"){window.open(FB,"_blank","noopener");return}
  botToggle(false);
  if(a.startsWith("sec:")){showSec(a.slice(4));scrollTo({top:0})}
  else if(a.startsWith("game:")){showSec("games");const id=a.slice(5);if(!$("#w-"+id).classList.contains("open"))togglePk(id);$("#w-"+id).scrollIntoView({block:"start"})}
}
$("#botFab").onclick=()=>botToggle(true);
$("#botClose").onclick=()=>botToggle(false);
$("#botForm").onsubmit=e=>{e.preventDefault();const v=$("#botIn").value;$("#botIn").value="";botAsk(v)};
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-bot]");if(g)return botGo(g.dataset.bot);
  const c=e.target.closest("[data-chip]");if(c)botAsk(c.dataset.chip);
});

const FB="https://www.facebook.com/share/g/1GuX3V5JRS/";
function dmToggle(on){const m=$("#dMenu");m.classList.toggle("on",on);$("#dotsBtn").setAttribute("aria-expanded",on)}
$("#dotsBtn").onclick=e=>{e.stopPropagation();dmToggle(!$("#dMenu").classList.contains("on"))};
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){dmToggle(false);const k=a.dataset.act;
    if(k==="support")openWA(t("hello"));
    else if(k==="bot")botToggle(true);
    else if(k==="request"){showSec("request");scrollTo({top:0})}
    return}
  if(!e.target.closest(".dots-wrap"))dmToggle(false);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")dmToggle(false)});
