<style>
:root{--bg:#F4F6FF;--card:#FFFFFF;--inner:#EDF1FF;--tx:#151B35;--sub:#68738D;--a:#2563EB;--b:#9333EA;--gold:#D99B16;--ok:#16A34A;--bd:rgba(37,99,235,.18);--bd2:rgba(147,51,234,.38);--g1:linear-gradient(135deg,#2563EB,#9333EA);--g2:linear-gradient(135deg,#FFD166,#F59E0B);--modal:#FFFFFF;--sh:0 10px 25px -5px rgba(37,99,235,.1)}
[data-theme="dark"]{--bg:#080B18;--card:#12182B;--inner:#0C1224;--tx:#F8FAFF;--sub:#A1AEC8;--a:#38BDF8;--b:#A78BFA;--gold:#FFD166;--ok:#34D399;--bd:rgba(56,189,248,.20);--bd2:rgba(167,139,250,.45);--g1:linear-gradient(135deg,#0284C7,#7C3AED);--g2:linear-gradient(135deg,#FFD700,#FF8A00);--modal:#12182B;--sh:0 15px 30px -5px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 15% 10%,#172554 0,transparent 35%),radial-gradient(circle at 85% 80%,#3B0764 0,transparent 35%),#030712;color:var(--tx);font-family:Cairo,sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(circle at 0 0,rgba(6,182,212,.08),transparent 35%),radial-gradient(circle at 100% 100%,rgba(147,51,234,.1),transparent 40%);position:relative;overflow-x:hidden;padding:14px 12px;box-shadow:0 0 50px rgba(37,99,235,.15)}
button,input,textarea{font-family:inherit}button{border:0;cursor:pointer}a{text-decoration:none;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.brand-t{background:linear-gradient(90deg,var(--a),var(--b),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;font-size:14px;cursor:pointer}
.sub{font-size:10px;font-weight:600;color:var(--sub)}
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:85px;height:85px;border-radius:22px;border:2px solid var(--a);box-shadow:0 0 25px rgba(56,189,248,.25)}
.skip{background:var(--g1);color:#fff;padding:9px 24px;border-radius:22px;font-weight:800;font-size:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:12px;margin-bottom:14px;background:var(--card);border:1px solid var(--bd2);border-radius:18px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--a);object-fit:cover;box-shadow:0 0 15px rgba(56,189,248,.35)}
.ctl{display:flex;gap:6px;align-items:center}
.ibtn{height:34px;min-width:34px;padding:0 9px;border-radius:50px;background:var(--card);color:var(--a);border:1px solid var(--bd);font-size:11px;font-weight:800;box-shadow:var(--sh)}
.search{position:relative;margin:6px 0 14px}
.search input{width:100%;padding:12px 40px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px}
.search input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(56,189,248,.15);outline:none}
.search i{position:absolute;top:50%;transform:translateY(-50%);color:var(--a);inset-inline-start:14px;font-size:14px}
.tabs,.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}
.tab,.subtab{flex-shrink:0;background:var(--card);color:var(--sub);border:1px solid var(--bd);padding:9px 15px;border-radius:14px;font-weight:800;font-size:12px}
.subtab{padding:6px 12px;font-size:11px;border-radius:16px}
.tab.on,.subtab.on{background:var(--g1);color:#fff;border-color:transparent;box-shadow:0 5px 15px rgba(37,99,235,.25)}
.sec{display:none}.sec.on{display:block;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ttl{font-size:16px;font-weight:900;margin:10px 0 12px;color:var(--tx);border-inline-start:4px solid var(--a);padding-inline-start:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gw{display:flex;flex-direction:column}.gw.open{grid-column:span 2}
.gc{background:linear-gradient(145deg,#172554,#111827);border:1px solid rgba(56,189,248,.25);border-radius:20px;overflow:hidden;box-shadow:0 12px 25px rgba(0,0,0,.3);transition:transform .2s}
.gc:hover{transform:translateY(-3px)}
.gi{height:116px;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at center,rgba(56,189,248,.20),transparent 65%),#0B1020;overflow:hidden}
.gi .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.6);filter:blur(16px) saturate(1.5);opacity:.38;pointer-events:none}
.gi img:not(.ghost){width:84px;height:84px;aspect-ratio:1/1;object-fit:cover;border-radius:20px;border:2px solid rgba(255,255,255,.25);background:#0B1020;box-shadow:0 10px 20px rgba(0,0,0,.5);position:relative;z-index:2}
.gn{padding:12px}
.gn b{display:block;font-size:13px;color:#fff}.gn small{display:block;color:#A5B4D0;font-size:10px;margin:3px 0 10px;font-weight:600}
.open-b{width:100%;background:linear-gradient(135deg,#0284C7,#7C3AED);color:#fff;padding:9px;border-radius:12px;font-weight:800;font-size:11px;box-shadow:0 4px 12px rgba(2,132,199,.3)}
.pk{display:none;margin-top:10px;background:var(--inner);border:1px solid var(--bd2);border-radius:18px;padding:12px}
.gw.open .pk{display:block;animation:fi .3s}
.pr{background:linear-gradient(145deg,var(--card),var(--inner));border:1px solid var(--bd2);border-radius:16px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px rgba(0,0,0,.1)}
.pn{font-weight:800;font-size:11px;min-height:28px;display:flex;align-items:center;line-height:1.3;color:var(--tx)}
.pp{background:linear-gradient(135deg,rgba(255,209,102,.15),rgba(245,158,11,.08));border:1px solid rgba(245,158,11,.35);color:var(--gold);padding:6px 8px;border-radius:12px;font-size:12px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:4px;margin:6px 0 8px}
.pp small{font-size:9px;opacity:.85}
.buy,.order{width:100%;background:linear-gradient(135deg,#FFD166,#F59E0B);color:#382000;border-radius:10px;padding:8px;font-weight:900;font-size:11px;box-shadow:0 4px 12px rgba(245,158,11,.3)}
.buy:active,.open-b:active,.order:active{transform:scale(.96)}
.pay,.form{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--sh)}
.pay h3{font-size:14px;margin-bottom:8px}
.copy,.wa{width:100%;margin-top:8px;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;padding:10px;border-radius:12px;font-weight:800;font-size:12px;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.wa{background:linear-gradient(135deg,#22C55E,#15803D);box-shadow:0 4px 12px rgba(34,197,94,.3)}
.in{width:100%;background:var(--inner);border:1px solid var(--bd);color:var(--tx);padding:11px 14px;border-radius:14px;margin-bottom:10px;font-size:12.5px}
.in:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(56,189,248,.15);outline:none}
textarea.in{min-height:80px;resize:none}
.soon{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 10px;text-align:center}
.sc i{font-size:26px;background:linear-gradient(135deg,#06B6D4,#9333EA);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.sc h3{font-size:13px}.sc p{font-size:10px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{background:var(--inner);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.st b{display:block;font-size:18px;color:var(--a)}.st span{font-size:11px;color:var(--sub)}
.modal{position:fixed;inset:0;z-index:98;background:rgba(3,4,7,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:12px}
.modal.on{display:flex}
.mb{width:100%;max-width:460px;max-height:90vh;overflow-y:auto;background:var(--modal);border:1px solid var(--bd2);border-radius:22px;padding:18px;box-shadow:0 25px 50px rgba(0,0,0,.5)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh h2{font-size:16px}
.x{width:32px;height:32px;border-radius:50%;background:var(--inner);color:var(--tx);font-size:16px;display:flex;align-items:center;justify-content:center}
.info{background:var(--inner);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.info small{color:var(--sub);font-size:10.5px}.info b{display:block;font-size:13.5px}
.disc{border:1px dashed var(--gold);border-radius:14px;padding:12px;text-align:center;margin-bottom:10px;background:rgba(245,158,11,.05)}
.disc .n{font-size:20px;font-weight:900;color:var(--gold)}.disc .o{font-size:11.5px;color:var(--sub);text-decoration:line-through}
.err{border-color:#EF4444!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;background:var(--modal);border:1px solid var(--a);color:var(--tx);padding:10px 20px;border-radius:20px;font-weight:800;font-size:12px;display:none;white-space:nowrap;box-shadow:0 10px 25px rgba(0,0,0,.3)}
footer{text-align:center;padding:24px 10px 16px;color:var(--sub);font-size:10.5px;font-weight:600}

/* ===== بوت ذكي ===== */
#botDock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:90;pointer-events:none}
#botFab{pointer-events:auto;position:absolute;bottom:18px;inset-inline-end:14px;width:56px;height:56px;border-radius:50%;background:var(--g1);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 25px rgba(37,99,235,.4)}
#botPanel{pointer-events:auto;display:none;flex-direction:column;height:min(80vh,580px);background:var(--modal);border:1px solid var(--bd2);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -15px 40px rgba(0,0,0,.4);overflow:hidden}

.bh{display:flex;align-items:center;gap:10px;padding:12px;background:var(--g1);color:#fff}
.bav{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px}
.bh b{font-size:14px;display:block}.bh small{font-size:10px;opacity:.9}
.bh .on-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ADE80;margin-inline-end:4px}
#botClose{margin-inline-start:auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:16px}
#botMsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.bm{max-width:88%;padding:10px 14px;border-radius:14px;font-size:12.5px;line-height:1.7;white-space:pre-line;word-break:break-word}
.bm.b{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-start-start-radius:4px}
.bm.u{align-self:flex-end;background:var(--g1);color:#fff;border-start-end-radius:4px}
.bgo{display:block;margin-top:8px;background:var(--g2);color:#382000;padding:6px 12px;border-radius:10px;font-weight:800;font-size:11px}
#botChips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 4px;background:var(--bg);scrollbar-width:none}
#botChips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card);color:var(--a);border:1px solid var(--bd2);padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700}
#botForm{display:flex;gap:8px;padding:10px 12px;background:var(--bg);border-top:1px solid var(--bd)}
#botIn{flex:1;background:var(--inner);border:1px solid var(--bd);color:var(--tx);padding:10px 14px;border-radius:999px;font-size:12.5px}
#botSend{width:42px;height:42px;border-radius:50%;background:var(--g1);color:#fff;font-size:14px}
[dir=rtl] #botSend i{transform:scaleX(-1)}

/* ===== قائمة النقاط الثلاث ===== */
.dots-wrap{position:relative}
.dots{width:34px;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.dmenu{position:absolute;top:42px;inset-inline-end:0;z-index:95;min-width:240px;background:var(--modal);border:1px solid var(--bd2);border-radius:18px;padding:8px;box-shadow:0 20px 45px rgba(0,0,0,.4);display:none}
.dmenu.on{display:block;animation:fi .2s}
.dm-t{font-size:10.5px;font-weight:800;color:var(--sub);padding:8px 10px 6px;letter-spacing:.3px}
.dmenu button,.dmenu a{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:transparent;color:var(--tx);font-size:12.5px;font-weight:700;text-align:start}
.dmenu button:hover,.dmenu a:hover{background:var(--inner)}
.di{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--c);flex-shrink:0}
.dm-lang{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 8px 8px}
.lang-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;border-radius:12px;background:var(--inner);color:var(--tx);font-size:11px;font-weight:800;border:1px solid var(--bd)}
.lang-btn.on{background:var(--g1);color:#fff;border-color:transparent}
.dm-divider{height:1px;background:var(--bd);margin:6px 8px}
#uBox{display:none;padding:10px;border-bottom:1px solid var(--bd);margin-bottom:4px}
#uName{display:block;font-size:13px;font-weight:900}
#uMail{display:block;font-size:10.5px;color:var(--sub);direction:ltr;text-align:start}

/* ===== شاشة تسجيل الدخول (Gate) ===== */
#gate{position:fixed;inset:0;z-index:97;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(37,99,235,.25),transparent 60%),#04060d}
#gate.on{display:flex}
.g-card{width:100%;max-width:360px;background:var(--modal);border:1px solid var(--bd2);border-radius:26px;padding:26px 20px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.6)}
.g-logo{width:85px;height:85px;border-radius:22px;border:2px solid var(--a);margin-bottom:14px;object-fit:cover;box-shadow:0 0 20px rgba(56,189,248,.3)}
#gate h2{font-size:18px;font-weight:900;margin-bottom:6px}
#gate p{font-size:12px;color:var(--sub);margin-bottom:20px;line-height:1.6}
.gbtn{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#ffffff,#f1f5f9);color:#1e293b;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #cbd5e1;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.g-secure{margin-top:14px;font-size:11px;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.g-secure i{color:var(--ok)}
</style>
</head>

      im.src=user.photoURL;im.alt="";im.className="uimg";im.referrerPolicy="no-referrer";
      b.appendChild(im);
    }else b.innerHTML='<i class="fa-solid fa-user"></i>';

    const customName = store.get("custom_username", "");
    const displayName = customName || user.displayName || "";
    $("#uName").textContent = displayName;
    $("#uMail").textContent = user.email||"";
    $("#uBox").style.display="block";
    $("#logoutItem").style.display="flex";
    $("#editNameItem").style.display="flex";
  }else{
    b.innerHTML='<i class="fa-brands fa-google"></i>';
    $("#uBox").style.display="none";
    $("#logoutItem").style.display="none";
    $("#editNameItem").style.display="none";
  }
}

function login(){
  if(!auth) return toast("❌ Firebase غير مهيأ");
  auth.signInWithPopup(provider).then(res=>{
    if(res && res.user && !store.get("custom_username", "")){
      setTimeout(()=>openNameModal(), 300);
    }
  }).catch(err=>{
    // Fallback لـ Redirect لو النافذة المنبثقة محظورة
    auth.signInWithRedirect(provider).catch(e2=>toast("❌ "+(e2.code||e2.message)));
  });
}

$("#gBtn").onclick=login;
$("#loginBtn").onclick=e=>{e.stopPropagation();if(user)dmToggle(true);else login()};
document.addEventListener("click",e=>{if(e.target.closest('[data-act="logout"]')&&auth)auth.signOut()});

if(auth){
  auth.getRedirectResult().then(res=>{
    if(res && res.user && !store.get("custom_username", "")){
      setTimeout(()=>openNameModal(), 300);
    }
  }).catch(()=>{});
  auth.onAuthStateChanged(u=>{user=u;renderUser()});
}
</script>
</body>
</html>
