<!-- ═══════════════════════════════════════════════════════════════
     ① CSS — انسخ هذا الجزء قبل </style> مباشرة
     ═══════════════════════════════════════════════════════════════ -->
<style>
/* ===== Premium Banner Slider ===== */
#hero{display:none;margin:0 0 12px}
body:has(#games.on) #hero,
body.hero-active #hero{display:block}

.hs{direction:ltr}
.hs-v{
  position:relative;aspect-ratio:var(--ar,16/7);border-radius:20px;overflow:hidden;
  background:#0B1020;perspective:1100px;touch-action:pan-y;
  -webkit-user-select:none;user-select:none;cursor:grab;outline:none;
  box-shadow:0 14px 30px -10px rgba(37,99,235,.5),
             0 0 0 1px rgba(56,189,248,.28),
             0 0 26px rgba(147,51,234,.2);
}
.hs-v:focus-visible{box-shadow:0 0 0 2px var(--a),0 14px 30px -10px rgba(37,99,235,.5)}
.hs-v.drag{cursor:grabbing}

.hs-s{
  position:absolute;inset:0;will-change:transform,opacity;backface-visibility:hidden;
  transition:transform .75s cubic-bezier(.22,.8,.24,1),opacity .75s ease,visibility .75s;
}
.hs-v.drag .hs-s{transition:none}
.hs-s img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}

.hs-v::after{
  content:"";position:absolute;inset:0;z-index:20;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,rgba(255,255,255,.14) 0,transparent 32%),
             linear-gradient(0deg,rgba(8,11,24,.28),transparent 35%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,255,255,.07);
}

.hs-d{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:9px}
.hs-d button{
  width:7px;height:7px;padding:0;border:0;border-radius:99px;background:var(--bd2);
  cursor:pointer;transition:width .35s,background .35s,box-shadow .35s;
}
.hs-d button.on{width:22px;background:var(--g1);box-shadow:0 0 10px rgba(56,189,248,.55)}
.hs-d button:focus-visible{outline:2px solid var(--a);outline-offset:3px}

@media(min-width:521px){.hs-v{border-radius:22px}}
@media(prefers-reduced-motion:reduce){
  .hs-s{transition-duration:.01ms}
  .hs-v.drag .hs-s{transition:none}
}
</style>


<!-- ═══════════════════════════════════════════════════════════════
     ② HTML — انسخ هذا الجزء بعد </header> وقبل <nav class="tabs">
     ═══════════════════════════════════════════════════════════════ -->
<section id="hero" role="region" aria-roledescription="carousel" aria-label="العروض">
  <div class="hs">
    <div class="hs-v" id="hsV" tabindex="0" aria-live="polite" aria-atomic="true"></div>
    <div class="hs-d" id="hsD" aria-label="اختيار الشريحة"></div>
  </div>
</section>


<!-- ═══════════════════════════════════════════════════════════════
     ③ JavaScript — انسخ هذا الجزء آخر السكربت الرئيسي قبل </script> الأخيرة
     ═══════════════════════════════════════════════════════════════ -->
<script>
/* ========= Premium Banner Slider ========= */
(function(){
  "use strict";
  const $ = (s, r=document) => r.querySelector(s);

  const v    = $("#hsV");
  const dots = $("#hsD");
  if (!v || !dots) return;

  // [رابط الصورة, الوصف, معرّف اللعبة (فارغ = تمرير لقائمة الألعاب)]
  const U = "https://cdn.imagetourls.com/uploads/tyImg/";
  const B = [
    ["OTVFsepS.png", "PUBG Mobile", "pubg"],
    ["185ya1XjC.png", "Free Fire", "ff"],
    ["174dv6OkZ.png", "Roblox", "roblox"],
    ["S32m5Lhy.png", "Yalla Ludo", "yalla"],
    ["5YbcUnOQ.png", "شحن جميع التطبيقات والألعاب", ""]
  ];
  const n = B.length;
  const DELAY = 4000;
  const FALLBACK = "data:image/svg+xml;utf8," +
    encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 140'>" +
      "<rect fill='%230B1020' width='320' height='140'/>" +
      "<text x='160' y='75' fill='%234a5568' font-size='14' " +
      "font-family='sans-serif' text-anchor='middle'>لا توجد صورة</text></svg>"
    );

  let cur = 0, dx = 0, w = 1, sx = 0, t0 = 0;
  let drag = false, moved = false, timer = null, visible = false;

  /* ---------- بناء الشرائح ---------- */
  const S = B.map((b, i) => {
    const s = document.createElement("div");
    s.className = "hs-s";
    s.setAttribute("role", "group");
    s.setAttribute("aria-roledescription", "slide");
    s.setAttribute("aria-label", b[1]);
    s.setAttribute("aria-hidden", i === 0 ? "false" : "true");

    const im = document.createElement("img");
    im.alt = b[1];
    im.decoding = "async";
    im.draggable = false;
    im.addEventListener("error", () => { im.src = FALLBACK; }, { once: true });

    if (i === 0) {
      im.setAttribute("fetchpriority", "high");
      im.src = U + b[0];
      im.dataset.l = "1";
      const setAr = () => {
        if (im.naturalWidth && im.naturalHeight) {
          v.style.setProperty(
            "--ar",
            Math.max(im.naturalWidth / im.naturalHeight, 1.6) + "/1"
          );
          lay();
        }
      };
      if (im.complete) setAr();
      else im.addEventListener("load", setAr, { once: true });
    }

    s.appendChild(im);
    v.appendChild(s);
    return s;
  });

  /* ---------- بناء النقاط ---------- */
  const D = B.map((_, i) => {
    const d = document.createElement("button");
    d.type = "button";
    d.setAttribute("aria-label", "الشريحة " + (i + 1) + " من " + n);
    d.addEventListener("click", () => go(i));
    dots.appendChild(d);
    return d;
  });

  /* ---------- تحميل كسول ---------- */
  function load(i) {
    const idx = (i % n + n) % n;
    const im = S[idx].firstChild;
    if (!im.dataset.l) {
      im.dataset.l = "1";
      im.src = U + B[idx][0];
    }
  }

  /* ---------- التخطيط 3D ---------- */
  function lay() {
    w = v.clientWidth || 1;
    S.forEach((s, i) => {
      const o = ((i - cur + n + (n >> 1)) % n) - (n >> 1);
      const p = o + dx / w;
      const a = Math.min(Math.abs(p), 1);
      const hide = Math.abs(p) > 1.05;

      s.style.transform =
        "translate3d(" + (p * 100) + "%,0,0) " +
        "rotateY(" + (-p * 16) + "deg) " +
        "scale(" + (1 - a * .08) + ")";
      s.style.opacity = 1 - a;
      s.style.visibility = hide ? "hidden" : "visible";
      s.style.zIndex = 10 - Math.round(a * 5);
      s.setAttribute("aria-hidden", (!hide && Math.abs(p) < 0.5) ? "false" : "true");
    });

    D.forEach((d, i) => {
      const on = i === cur;
      d.classList.toggle("on", on);
      if (on) d.setAttribute("aria-current", "true");
      else d.removeAttribute("aria-current");
    });
  }

  /* ---------- التنقل ---------- */
  function go(k) {
    cur = (k % n + n) % n;
    dx = 0;
    load(cur); load(cur + 1); load(cur - 1);
    lay();
    play();
  }

  function stop() { clearInterval(timer); timer = null; }
  function play() {
    stop();
    if (!document.hidden && visible) {
      timer = setInterval(() => go(cur + 1), DELAY);
    }
  }

  /* ---------- السحب ---------- */
  v.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    drag = true; moved = false;
    sx = e.clientX; dx = 0; t0 = Date.now();
    stop();
    try { v.setPointerCapture(e.pointerId); } catch (_) {}
  });

  v.addEventListener("pointermove", e => {
    if (!drag) return;
    dx = e.clientX - sx;
    if (!moved && Math.abs(dx) > 10) {
      moved = true;
      v.classList.add("drag");
    }
    if (moved) lay();
  });

  const end = () => {
    if (!drag) return;
    drag = false;
    v.classList.remove("drag");

    const dt = Date.now() - t0 + 1;
    const fast = Math.abs(dx) / dt > .5;
    const swipe = moved && (Math.abs(dx) > w * .18 || (fast && Math.abs(dx) > 24));

    if (swipe) go(cur + (dx < 0 ? 1 : -1));
    else { dx = 0; lay(); play(); }

    setTimeout(() => { moved = false; }, 0);
  };
  v.addEventListener("pointerup", end);
  v.addEventListener("pointercancel", end);

  /* ---------- فتح اللعبة ---------- */
  function open() {
    const id = B[cur][2];
    try {
      if (typeof showSec === "function") showSec("games");

      const q = $("#q");
      if (q && q.value && typeof filterGames === "function") {
        q.value = "";
        filterGames();
      }

      if (id) {
        const card = $("#w-" + id);
        if (card) {
          if (!card.classList.contains("open") && typeof togglePk === "function") {
            togglePk(id);
          } else {
            card.scrollIntoView({ behavior: "smooth", block: "start" });
          }
          return;
        }
      }

      const grid = $("#gameGrid");
      if (grid) grid.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (err) {
      console.warn("[Slider] open() failed:", err);
    }
  }

  v.addEventListener("click", () => {
    if (!moved) open();
    moved = false;
  });

  v.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
  });

  /* ---------- إيقاف مؤقت ---------- */
  v.addEventListener("mouseenter", stop);
  v.addEventListener("mouseleave", () => { if (!drag) play(); });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : play());

  /* ---------- إيقاف عند خروج السلايدر من الرؤية ---------- */
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(entries => {
      visible = entries[0].isIntersecting;
      if (visible) { lay(); play(); } else stop();
    }, { threshold: 0.15 }).observe(v);
  } else {
    visible = true;
  }

  /* ---------- إعادة الحساب عند تغيّر الحجم ---------- */
  let raf = 0;
  const scheduleLay = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; lay(); });
  };
  if ("ResizeObserver" in window) {
    new ResizeObserver(scheduleLay).observe(v);
  } else {
    addEventListener("resize", scheduleLay);
  }

  /* ---------- fallback لـ :has() ---------- */
  const games = $("#games");
  if (games) {
    const syncHero = () =>
      document.body.classList.toggle("hero-active", games.classList.contains("on"));
    syncHero();
    new MutationObserver(syncHero).observe(games, {
      attributes: true,
      attributeFilter: ["class"]
    });
  }

  /* ---------- بدء ---------- */
  lay();
  visible = v.offsetParent !== null;
  if (visible) play();

  /* ---------- تحميل كسول للباقي ---------- */
  const idle = window.requestIdleCallback || (f => setTimeout(f, 900));
  idle(() => {
    load(1); load(n - 1);
    setTimeout(() => B.forEach((_, i) => load(i)), 2500);
  });
})();
</script>
