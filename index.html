<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة الإدارة | أسرع من نتكم 🔥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{color-scheme:dark;--bg:#080B18;--card:#12182B;--inner:#0C1224;--tx:#F8FAFF;--sub:#A1AEC8;--a:#38BDF8;--b:#A78BFA;--gold:#FFD166;--ok:#34D399;--bd:rgba(56,189,248,.20);--bd2:rgba(167,139,250,.45);--g1:linear-gradient(135deg,#0284C7,#7C3AED);--g2:linear-gradient(135deg,#FFD700,#FF8A00);--modal:#12182B;--sh:0 12px 24px -6px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#030712;color:var(--tx);font-family:Cairo,sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;padding:14px 12px 90px}
button,input,textarea,select{font-family:inherit}button{border:0;cursor:pointer;background:transparent;color:inherit}a{text-decoration:none;color:inherit}
.brand-t{background:linear-gradient(90deg,#06B6D4,#9333EA,#D99B16);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;font-size:15px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:14px;border-radius:18px;background:var(--card);border:1px solid var(--bd2)}
.ttl{font-size:15px;font-weight:900;margin:12px 0 8px;border-inline-start:4px solid var(--a);padding-inline-start:9px;color:var(--gold)}
.form,.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.in{width:100%;background:var(--inner);border:1px solid var(--bd);color:var(--tx);padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:12px}
.btn{width:100%;background:var(--g1);color:#fff;padding:10px;border-radius:12px;font-weight:900;font-size:12px;box-shadow:0 4px 15px rgba(56,189,248,.3)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--inner);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.st b{display:block;font-size:18px;color:var(--a)}.st span{font-size:10px;color:var(--sub)}
.order-card{background:var(--inner);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;font-size:11.5px}
.oc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.status-pill{padding:3px 9px;border-radius:20px;font-size:9.5px;font-weight:900}
.st-pending{background:rgba(245,158,11,.15);color:#D97706}
.st-paid{background:rgba(37,99,235,.15);color:#38BDF8}
.st-processing{background:rgba(147,51,234,.15);color:#A78BFA}
.st-done{background:rgba(22,163,74,.15);color:#34D399}
.st-rejected,.st-cancelled{background:rgba(239,68,68,.15);color:#EF4444}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:9998;background:var(--modal);border:1px solid var(--a);color:var(--tx);padding:8px 18px;border-radius:20px;font-weight:800;font-size:11px;display:none;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.dots-wrap{position:relative}
.ibtn{height:34px;min-width:34px;padding:0 8px;border-radius:50px;background:var(--card);color:var(--a);border:1px solid var(--bd);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.dmenu{position:absolute;top:44px;inset-inline-end:0;z-index:99999;min-width:240px;max-height:75vh;overflow-y:auto;background:var(--modal);border:1px solid var(--bd2);border-radius:16px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.8);display:none}
.dmenu.on{display:block}
.dmenu button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:transparent;color:var(--tx);font-size:12px;font-weight:700;text-align:start}
.dmenu button:hover{background:var(--inner)}
.di{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:var(--c);flex-shrink:0}
</style>
</head>
<body>

<div id="toast" role="status"></div>

<div id="app">
  <header>
    <div>
      <span class="brand-t">لوحة الإدارة | أسرع من نتكم 🔥</span>
      <div style="font-size:10px;color:var(--sub)">إدارة المتجر والعملاء والطلبات</div>
    </div>
    <div class="dots-wrap">
      <button class="ibtn" id="adminMenuBtn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      <div class="dmenu" id="adminMenu">
        <button onclick="switchTab('overview')"><span class="di" style="--c:#38BDF8"><i class="fa-solid fa-chart-line"></i></span><span>الإحصائيات العامة</span></button>
        <button onclick="switchTab('orders')"><span class="di" style="--c:#F59E0B"><i class="fa-solid fa-receipt"></i></span><span>إدارة الطلبات</span></button>
        <button onclick="switchTab('balance')"><span class="di" style="--c:#10B981"><span class="fa-solid fa-wallet"></i></span><span>شحن رصيد للعميل</span></button>
        <button onclick="switchTab('users')"><span class="di" style="--c:#EF4444"><i class="fa-solid fa-users-slash"></i></span><span>قائمة الحظر والعملاء</span></button>
        <button onclick="switchTab('tickets')"><span class="di" style="--c:#A78BFA"><i class="fa-solid fa-headset"></i></span><span>تذاكر الدعم الفني</span></button>
      </div>
    </div>
  </header>

  <!-- تبويب الإحصائيات -->
  <div id="tab-overview" class="tab-content">
    <div class="ttl">📊 إحصائيات المتجر</div>
    <div class="stats" id="statsGrid"></div>
  </div>

  <!-- تبويب الطلبات -->
  <div id="tab-orders" class="tab-content" style="display:none">
    <div class="ttl">📦 إدارة طلبات العملاء</div>
    <div id="adminOrdersList"></div>
  </div>

  <!-- تبويب شحن الرصيد -->
  <div id="tab-balance" class="tab-content" style="display:none">
    <div class="ttl">⚡ شحن رصيد تلقائي للعميل</div>
    <div class="form">
      <input id="targetUid" class="in" placeholder="أدخل ID العميل (REAL-XXXXXX)" style="direction:ltr">
      <input id="targetAmount" class="in" type="number" placeholder="المبلغ المراد شحنه">
      <button class="btn" id="sendBalanceBtn">🚀 شحن رصيد العميل فوراً</button>
      <div id="balanceFeedback" style="font-size:11px;font-weight:700;margin-top:6px;min-height:16px"></div>
    </div>
  </div>

  <!-- تبويب الحظر والعملاء -->
  <div id="tab-users" class="tab-content" style="display:none">
    <div class="ttl">🚫 إدارة المستخدمين وقائمة الحظر</div>
    <div class="form">
      <input id="banUidInput" class="in" placeholder="أدخل ID العميل للحظر/فك الحظر (REAL-XXXXXX)" style="direction:ltr">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <button class="btn" id="banUserBtn" style="background:linear-gradient(135deg,#EF4444,#DC2626)">🚫 حظر المستخدم</button>
        <button class="btn" id="unbanUserBtn" style="background:linear-gradient(135deg,#10B981,#059669)">✅ فك الحظر</button>
      </div>
      <div id="banFeedback" style="font-size:11px;font-weight:700;margin-top:6px;min-height:16px"></div>
    </div>
    <div class="ttl" style="font-size:13px">قائمة المستخدمين المسجلين حالياً</div>
    <div id="allUsersList"></div>
  </div>

  <!-- تبويب تذاكر الدعم -->
  <div id="tab-tickets" class="tab-content" style="display:none">
    <div class="ttl">🎧 تذاكر الدعم الفني الواردة</div>
    <div id="adminTicketsList"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
"use strict";
const firebaseConfig = {
  apiKey: "AIzaSyAMdGfiAhH1xmG0qETz3KU-nxhua1V4baM",
  authDomain: "real-store-c91ec.firebaseapp.com",
  databaseURL: "https://real-store-c91ec-default-rtdb.firebaseio.com",
  projectId: "real-store-c91ec",
  storageBucket: "real-store-c91ec.appspot.com",
  messagingSenderId: "315828860330",
  appId: "1:315828860330:web:3b2fb64a105ebb1ae627d3"
};
let db=null, firebaseOK=false;
try {
  if(typeof firebase !== "undefined"){
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    firebaseOK = true;
  }
} catch(e){ console.warn("Firebase init failed:", e); }

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(tt);tt=setTimeout(()=>e.style.display="none",3000)}

// قائمة الـ 3 نقاط العلوية الفورية
$("#adminMenuBtn").onclick = (e)=>{ e.stopPropagation(); $("#adminMenu").classList.toggle("on"); };
document.addEventListener("click", (e)=>{ if(!e.target.closest(".dots-wrap")) $("#adminMenu").classList.remove("on"); });

window.switchTab = function(tabName){
  $$(".tab-content").forEach(el => el.style.display = "none");
  const target = $("#tab-" + tabName);
  if(target) target.style.display = "block";
  $("#adminMenu").classList.remove("on");
  if(tabName === "orders") loadAdminOrders();
  if(tabName === "users") loadAllUsers();
  if(tabName === "tickets") loadAdminTickets();
};

function loadStats(){
  if(!firebaseOK || !db) return;
  db.ref('orders').once('value').then(s=>{
    let totalOrders = 0, totalRevenue = 0;
    const ordersData = s.val() || {};
    Object.values(ordersData).forEach(userOrders => {
      Object.values(userOrders || {}).forEach(o => {
        totalOrders++;
        if(o.status === "done") totalRevenue += (o.total || 0);
      });
    });
    $("#statsGrid").innerHTML = `
      <div class="st"><span>إجمالي الطلبات</span><b>${totalOrders}</b></div>
      <div class="st"><span>إجمالي المبيعات (المنفذة)</span><b>${totalRevenue.toFixed(2)} ج.م</b></div>
    `;
  });
}

const STATUS_MAP = {
  pending:{t:"في انتظار الدفع",c:"st-pending"},
  paid:{t:"تم استلام الدفع",c:"st-paid"},
  processing:{t:"جاري التنفيذ",c:"st-processing"},
  done:{t:"تم التنفيذ",c:"st-done"},
  rejected:{t:"مرفوض",c:"st-rejected"},
  cancelled:{t:"ملغي",c:"st-cancelled"}
};

function loadAdminOrders(){
  if(!firebaseOK || !db){ $("#adminOrdersList").innerHTML='<p style="font-size:11px;color:var(--sub)">Firebase غير مفعّل</p>'; return; }
  db.ref('orders').limitToLast(30).once('value').then(s=>{
    const data = s.val()||{};
    const flat = [];
    Object.entries(data).forEach(([uid, orders])=>{ Object.entries(orders||{}).forEach(([oid,o])=>flat.push({uid,oid,...o})); });
    flat.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(!flat.length){ $("#adminOrdersList").innerHTML='<p style="font-size:11px;color:var(--sub);padding:10px">لا توجد طلبات حتى الآن</p>'; return; }
    $("#adminOrdersList").innerHTML = flat.map(o=>`
      <div class="order-card">
        <div class="oc-top"><b>${esc(o.oid)}</b><span class="status-pill ${(STATUS_MAP[o.status]||STATUS_MAP.pending).c}">${(STATUS_MAP[o.status]||STATUS_MAP.pending).t}</span></div>
        <div style="font-size:10px;color:var(--sub);margin-bottom:4px">العميل: ${esc(o.name||o.uid)}</div>
        <div style="font-size:11px;margin:4px 0">${(o.items||[]).map(it=>`• ${esc(it.title)} ×${it.qty||1}`).join("<br>")}</div>
        <b style="color:var(--gold)">${(o.total||0).toFixed(2)} ج.م</b>
        <select onchange="updateOrderStatus('${esc(o.uid)}','${esc(o.oid)}',this.value)" style="width:100%;margin-top:6px;padding:6px;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-size:11px">
          ${Object.entries(STATUS_MAP).map(([k,v])=>`<option value="${k}" ${o.status===k?"selected":""}>${v.t}</option>`).join("")}
        </select>
      </div>
    `).join("");
  });
}

window.updateOrderStatus = function(uid, oid, status){
  if(!firebaseOK || !db) return;
  db.ref('orders/'+uid+'/'+oid+'/status').set(status).then(()=>{
    db.ref('notifications/'+uid+'/'+('status_'+Date.now())).set({title:"تحديث حالة الطلب",body:"تم تغيير حالة الطلب "+oid+" إلى: "+(STATUS_MAP[status]||{}).t,time:Date.now(),read:false}).catch(()=>{});
    toast("✅ تم تحديث الحالة بنجاح");
    loadAdminOrders();
  }).catch(err=>toast("❌ " + err.message));
};

$("#sendBalanceBtn").onclick = ()=>{
  const uid = $("#targetUid").value.trim();
  const amount = parseFloat($("#targetAmount").value);
  const fb = $("#balanceFeedback");
  if(!uid){ fb.style.color="#EF4444"; fb.textContent="❌ أدخل ID العميل"; return; }
  if(!amount || isNaN(amount)){ fb.style.color="#EF4444"; fb.textContent="❌ أدخل مبلغ صحيح"; return; }
  if(!firebaseOK || !db){ fb.style.color="#EF4444"; fb.textContent="❌ Firebase غير مفعّل"; return; }
  
  const ref = db.ref('users/'+uid+'/wallet');
  ref.once('value').then(s=>{
    const cur = s.val()||0, nw = cur + amount;
    ref.set(nw).then(()=>{
      fb.style.color = "var(--ok)";
      fb.textContent = `✅ تم شحن مبلغ (${amount}) للعميل (${uid}) وأصبح رصيده: (${nw})`;
      toast("🚀 تم شحن الرصيد بنجاح");
      $("#targetUid").value=""; $("#targetAmount").value="";
    }).catch(err=>{ fb.style.color="#EF4444"; fb.textContent="❌ " + err.message; });
  });
};

function setUserBlock(isBlocked){
  const uid = $("#banUidInput").value.trim();
  const fb = $("#banFeedback");
  if(!uid){ fb.style.color="#EF4444"; fb.textContent="❌ أدخل ID العميل أولاً"; return; }
  if(!firebaseOK || !db){ fb.style.color="#EF4444"; fb.textContent="❌ Firebase غير مفعّل"; return; }
  
  db.ref('users/'+uid+'/isBlocked').set(isBlocked).then(()=>{
    fb.style.color = isBlocked ? "#EF4444" : "#10B981";
    fb.textContent = isBlocked ? `🚫 تم حظر العميل (${uid}) فوراً بنجاح` : `✅ تم فك الحظر عن العميل (${uid}) بنجاح`;
    toast(isBlocked ? "🚫 تم الحظر بنجاح" : "✅ تم فك الحظر");
    $("#banUidInput").value = "";
    loadAllUsers();
  }).catch(err=>{ fb.style.color="#EF4444"; fb.textContent="❌ " + err.message; });
}

$("#banUserBtn").onclick = ()=>setUserBlock(true);
$("#unbanUserBtn").onclick = ()=>setUserBlock(false);

function loadAllUsers(){
  const box = $("#allUsersList");
  if(!firebaseOK || !db){ box.innerHTML='<p style="font-size:11px;color:var(--sub)">Firebase غير مفعّل</p>'; return; }
  db.ref('users').once('value').then(s=>{
    const users = s.val()||{};
    const arr = Object.entries(users);
    if(!arr.length){ box.innerHTML='<p style="font-size:11px;color:var(--sub);padding:10px">لا توجد حسابات مسجلة حتى الآن</p>'; return; }
    box.innerHTML = arr.map(([uid, u])=>{
      const isBanned = u.isBlocked === true;
      const name = (u.profile && u.profile.name) ? u.profile.name : "مستخدم";
      const email = (u.profile && u.profile.email) ? u.profile.email : "-";
      return `
        <div class="order-card" style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <b style="color:var(--a);direction:ltr;display:block">${esc(uid)}</b>
            <div style="font-size:11px">${esc(name)}</div>
            <div style="font-size:9.5px;color:var(--sub);direction:ltr">${esc(email)}</div>
            <div style="margin-top:4px"><span class="status-pill ${isBanned?'st-rejected':'st-done'}">${isBanned?'محظور 🚫':'نشط ✅'}</span></div>
          </div>
          <div>
            <button onclick="quickToggleBan('${esc(uid)}', ${!isBanned})" style="padding:6px 10px;border-radius:8px;font-size:10.5px;font-weight:900;background:${isBanned?'#10B981':'#EF4444'};color:#fff">
              ${isBanned?'فك الحظر':'حظر'}
            </button>
          </div>
        </div>
      `;
    }).join("");
  });
}

window.quickToggleBan = function(uid, shouldBlock){
  if(!firebaseOK || !db) return;
  db.ref('users/'+uid+'/isBlocked').set(shouldBlock).then(()=>{
    toast(shouldBlock ? "🚫 تم حظر المستخدم" : "✅ تم فك الحظر");
    loadAllUsers();
  });
};

function loadAdminTickets(){
  const box = $("#adminTicketsList");
  if(!firebaseOK || !db){ box.innerHTML='<p style="font-size:11px;color:var(--sub)">Firebase غير مفعّل</p>'; return; }
  db.ref('admin_tickets').once('value').then(s=>{
    const tickets = s.val()||{};
    const arr = Object.entries(tickets).sort((a,b)=>(b[1].time||0)-(a[1].time||0));
    if(!arr.length){ box.innerHTML='<p style="font-size:11px;color:var(--sub);padding:10px">لا توجد تذاكر دعم فني</p>'; return; }
    box.innerHTML = arr.map(([tid, t])=>`
      <div class="order-card">
        <div class="oc-top"><b>${esc(t.subject)}</b><span style="font-size:9.5px;color:var(--sub)">${esc(t.uid)}</span></div>
        <div style="font-size:10px;color:var(--gold);margin-bottom:4px">المرسل: ${esc(t.name||"-")}</div>
        <p style="color:var(--tx);margin:4px 0">${esc(t.message)}</p>
        ${t.reply ? `<div style="background:var(--card);border:1px solid var(--bd2);border-radius:8px;padding:6px;margin:6px 0;color:var(--ok)"><b>ردك:</b> ${esc(t.reply)}</div>` : ''}
        <div style="display:flex;gap:6px;margin-top:6px">
          <input id="reply-${tid}" class="in" placeholder="اكتب الرد هنا..." style="margin:0;font-size:11px" value="${esc(t.reply||"")}">
          <button onclick="sendTicketReply('${esc(t.uid)}','${esc(tid)}')" style="padding:6px 12px;border-radius:8px;background:var(--g1);color:#fff;font-weight:900;font-size:11px;white-space:nowrap">إرسال الرد</button>
        </div>
      </div>
    `).join("");
  });
}

window.sendTicketReply = function(uid, tid){
  const replyText = $("#reply-"+tid).value.trim();
  if(!replyText) return toast("⚠️ اكتب الرد أولاً");
  if(!firebaseOK || !db) return;
  
  const updates = {};
  updates['support_tickets/'+uid+'/'+tid+'/reply'] = replyText;
  updates['support_tickets/'+uid+'/'+tid+'/readByClient'] = false;
  updates['admin_tickets/'+tid+'/reply'] = replyText;

  db.ref().update(updates).then(()=>{
    toast("✅ تم إرسال الرد للعميل بنجاح");
    loadAdminTickets();
  }).catch(err=>toast("❌ " + err.message));
};

loadStats();
</script>
</body>
</html>
